<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commande confirmée — Ælen Paris</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/img/brand/icon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/brand/icon-192.png" />
  <link rel="apple-touch-icon" href="/assets/img/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#f6f2ea" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="#top" class="brand" aria-label="Ælen Paris — accueil">
        <img class="brand-logo" src="assets/img/brand/logo-aelen-paris.png" alt="Ælen Paris" width="76" height="58" />
      </a>
    </div>
  </header>

  <main>
    <section class="section confirm-section">
      <div class="wrap confirm-wrap">
        <p class="section-eyebrow">Merci</p>
        <h1>Votre commande est confirmée</h1>
        <p>
          Un e-mail de confirmation vient de vous être envoyé avec le détail de votre commande.
          Vous recevrez votre numéro de suivi par e-mail dès l'expédition de votre colis.
        </p>
        <p class="confirm-order-id" id="confirm-order-id"></p>
        <a href="index.html#collection" class="btn btn-solid">Poursuivre mes achats</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom">
        <span>© <span id="year"></span> Ælen Paris. Tous droits réservés.</span>
        <span>Paris, France</span>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");
    if (sessionId) {
      document.getElementById("confirm-order-id").textContent =
        "Référence commande : " + sessionId;
    }
    try {
      localStorage.removeItem("aelen-cart");
    } catch (e) {}
  </script>
</body>
</html>
